development:
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  url: <%= ENV.fetch("DATABASE_URL", "postgres://ovx:ovx@127.0.0.1:55432/ovx_development") %>

test:
  adapter: postgresql
  encoding: unicode
  pool: 5
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgres://ovx:ovx@127.0.0.1:55432/ovx_test") %>

production:
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  url: <%= ENV["DATABASE_URL"] %>
